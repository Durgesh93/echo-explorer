<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Explorer</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:24px; padding:0 20px; height:52px; background:var(--bg); color:var(--fg); flex:0 0 auto; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  nav { display:flex; gap:4px; }
  nav a { color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:6px; font-size:14px; }
  nav a:hover { color:var(--fg); background:#1e293b; }
  nav a.active { color:var(--bg); background:var(--accent); }
  iframe { flex:1 1 auto; width:100%; border:0; }
</style>
</head>
<body>
<header>
  <h1>Echo Explorer</h1>
  <nav>
    <a href="#echo-measurements" data-src="pages/echo-measurements.html">Echo measurements guideline</a>
    <a href="#ct-echo-explorer" data-src="pages/ct-echo-explorer.html">CT echo explorer</a>
  </nav>
</header>
<iframe id="view" title="Page view"></iframe>
<script>
  const links=[...document.querySelectorAll('nav a')], view=document.getElementById('view');
  function show(){
    const id=location.hash.slice(1)||'echo-measurements';
    const a=links.find(l=>l.hash==='#'+id)||links[0];
    links.forEach(l=>l.classList.toggle('active',l===a));
    if(view.getAttribute('src')!==a.dataset.src) view.src=a.dataset.src;
    document.title=a.textContent+' · Echo Explorer';
  }
  window.addEventListener('hashchange',show); show();
</script>
</body>
</html>
